name: Generate Contribution Snake

on:
  # Schedule: runs every 24 hours at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Allows manual execution anytime from the Actions tab
  workflow_dispatch:
  
  # Run on push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    # Required permissions to write the generated SVG to the output branch
    permissions:
      contents: write

    steps:
      # Generates the snake SVGs from the user's GitHub contribution grid
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Deploys the SVG files into the 'output' branch of the repository
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
