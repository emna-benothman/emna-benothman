<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Emna Ben Othman - AI Engineering Student">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="20"/></clipPath>
    <style>
      .name { font: 800 62px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
      .role { font: 600 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); letter-spacing: 0.5px; }
      .meta { font: 400 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #c7d2fe; }
      .chip { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e0e7ff; }
      .float1 { animation: f1 7s ease-in-out infinite; }
      .float2 { animation: f2 9s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,14px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-28px,-12px); } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="float1" cx="1010" cy="70" r="230" fill="url(#glowA)"/>
    <circle class="float2" cx="1120" cy="270" r="210" fill="url(#glowB)"/>

    <!-- decorative rings -->
    <g fill="none" stroke="url(#accent)" stroke-opacity="0.55">
      <circle cx="1040" cy="150" r="92" stroke-width="1.5"/>
      <circle cx="1040" cy="150" r="62" stroke-width="1.5" stroke-dasharray="4 8"/>
      <circle cx="1040" cy="150" r="30" stroke-width="2"/>
    </g>
    <circle cx="1040" cy="150" r="7" fill="url(#accent)"/>
    <circle cx="1132" cy="150" r="5" fill="#22d3ee"/>
    <circle cx="994" cy="70" r="4" fill="#f472b6"/>
    <circle cx="972" cy="226" r="4" fill="#a78bfa"/>

    <!-- text -->
    <rect x="70" y="62" width="64" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="name" x="68" y="132">Emna Ben Othman</text>
    <text class="role" x="70" y="172">AI Engineering Student &#183; Applied ML &#183; Software Engineering</text>
    <text class="meta" x="70" y="204">ESPRIT School of Engineering &#8212; Class of 2029 &#8212; Ariana, Tunisia</text>

    <!-- chips -->
    <g>
      <rect x="70"  y="232" width="92"  height="32" rx="16" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text class="chip" x="116" y="253" text-anchor="middle">Python</text>
      <rect x="174" y="232" width="78"  height="32" rx="16" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text class="chip" x="213" y="253" text-anchor="middle">C++</text>
      <rect x="264" y="232" width="92"  height="32" rx="16" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6"/>
      <text class="chip" x="310" y="253" text-anchor="middle">Django</text>
      <rect x="368" y="232" width="108" height="32" rx="16" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.6"/>
      <text class="chip" x="422" y="253" text-anchor="middle">LLM Systems</text>
      <rect x="488" y="232" width="100" height="32" rx="16" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text class="chip" x="538" y="253" text-anchor="middle">Data / ML</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
